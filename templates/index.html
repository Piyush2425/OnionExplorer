<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="OnionExplorer — Dark web threat intelligence dashboard for monitoring ransomware group and market onion link statuses.">
    <title>OnionExplorer — Dark Web Threat Intelligence</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧅</text></svg>">
</head>
<body>
    <div class="app-container">

        <!-- ═══ HEADER ═══ -->
        <header class="app-header">
            <div class="brand">
                <div class="brand-icon">🧅</div>
                <div class="brand-text">
                    <h1>OnionExplorer</h1>
                    <span class="tagline">Dark Web Threat Intelligence</span>
                </div>
            </div>
            <div class="header-right">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="Search groups, markets, URLs..." autocomplete="off">
                </div>
                <div class="scrape-status" id="scrapeStatus">
                    <span class="status-dot" id="scrapeStatusDot"></span>
                    <span id="scrapeStatusText">Loading...</span>
                </div>
                <button class="theme-toggle-btn" id="themeToggleBtn" title="Toggle Light/Dark Theme">☀️ Light UI</button>
                <div class="settings-menu-container">
                    <button class="settings-btn" id="settingsBtn" title="Scraper Settings">⚙️ Config</button>
                    <div class="settings-dropdown" id="settingsDropdown">
                        <div class="settings-group">
                            <label for="intervalSelect">Scrape Every:</label>
                            <select id="intervalSelect">
                                <option value="720">12 Hours</option>
                                <option value="1440" selected>24 Hours</option>
                                <option value="2880">48 Hours</option>
                            </select>
                        </div>
                        <button class="settings-action-btn" id="runScrapeBtn">🔄 Scrape Now</button>
                    </div>
                </div>
            </div>
        </header>

        <!-- ═══ STATS ROW ═══ -->
        <section class="stats-row" id="statsRow">
            <div class="stat-card cyan">
                <div class="stat-label">Forums/Groups</div>
                <div class="stat-value" id="statGroups">—</div>
            </div>
            <div class="stat-card purple">
                <div class="stat-label">Markets</div>
                <div class="stat-value" id="statMarkets">—</div>
            </div>
            <div class="stat-card orange">
                <div class="stat-label">Telegram</div>
                <div class="stat-value" id="statTelegram">—</div>
            </div>
            <div class="stat-card yellow">
                <div class="stat-label">Total URLs</div>
                <div class="stat-value" id="statUrls">—</div>
            </div>
            <div class="stat-card green">
                <div class="stat-label">Online</div>
                <div class="stat-value" id="statOnline">—</div>
            </div>
            <div class="stat-card red">
                <div class="stat-label">Offline</div>
                <div class="stat-value" id="statOffline">—</div>
            </div>
        </section>

        <!-- ═══ TABS + FILTERS ═══ -->
        <section class="controls-bar">
            <div class="tab-group">
                <button class="tab active" data-tab="forums_groups" id="tabGroups">
                    <span class="tab-icon">👥</span> Forums & Groups
                    <span class="tab-count" id="tabGroupsCount">0</span>
                </button>
                <button class="tab" data-tab="markets" id="tabMarkets">
                    <span class="tab-icon">🏪</span> Markets
                    <span class="tab-count" id="tabMarketsCount">0</span>
                </button>
                <button class="tab" data-tab="telegram_links" id="tabTelegram">
                    <span class="tab-icon">📢</span> Telegram Links
                    <span class="tab-count" id="tabTelegramCount">0</span>
                </button>
            </div>
            <div class="filter-group">
                <div class="filter-chips">
                    <button class="chip active" data-filter="all" id="filterAll">All</button>
                    <button class="chip" data-filter="has-online" id="filterOnline">Has Online</button>
                    <button class="chip" data-filter="all-offline" id="filterOffline">All Offline</button>
                </div>
                <div class="sort-dropdown">
                    <select id="sortSelect">
                        <option value="name-asc">Name A→Z</option>
                        <option value="name-desc">Name Z→A</option>
                        <option value="urls-desc">Most URLs</option>
                        <option value="online-desc">Most Online</option>
                        <option value="sources-desc">Most Sources</option>
                    </select>
                </div>
                <div class="sort-dropdown">
                    <select id="sourceFilterSelect">
                        <option value="all">🔍 All Sources</option>
                        <option value="ransomfeed">RansomFeed</option>
                        <option value="ransomlook">RansomLook</option>
                        <option value="ransomware.live">Ransomware.live</option>
                        <option value="github:ransomware_gang.md">GitHub: ransomware_gang.md</option>
                        <option value="github:forum.md">GitHub: forum.md</option>
                        <option value="github:markets.md">GitHub: markets.md</option>
                        <option value="github:telegram_infostealer.md">GitHub: telegram_infostealer.md</option>
                        <option value="github:telegram_threat_actors.md">GitHub: telegram_threat_actors.md</option>
                    </select>
                </div>
                <button class="chip export-btn" id="exportCsvBtn" title="Download sanitized CSV file">
                    📥 Export CSV
                </button>
                <button class="chip export-btn md-btn" id="exportMdBtn" title="Download corporate Markdown report">
                    📝 Export Markdown
                </button>
            </div>
        </section>

        <!-- ═══ ENTITY LIST ═══ -->
        <section class="entity-list" id="entityList">
            <div class="loading-overlay">
                <div class="spinner"></div>
                <div class="loading-text">Loading threat intelligence data...</div>
            </div>
        </section>

        <!-- ═══ FOOTER ═══ -->
        <footer class="app-footer">
            <div class="footer-left">
                OnionExplorer v2.0 — Threat Intelligence Dashboard
            </div>
            <div class="footer-sources">
                <a href="https://www.ransomfeed.it" target="_blank" rel="noopener" class="footer-source-link">RansomFeed</a>
                <a href="https://www.ransomlook.io" target="_blank" rel="noopener" class="footer-source-link">RansomLook</a>
                <a href="https://www.ransomware.live" target="_blank" rel="noopener" class="footer-source-link">Ransomware.live</a>
            </div>
        </footer>

    </div>

    <script src="/static/js/dashboard.js"></script>
</body>
</html>
