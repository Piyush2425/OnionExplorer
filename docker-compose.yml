version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - DB_TYPE=sqlite
      - SCRAPE_INTERVAL_MINUTES=1440
      - SECRET_KEY=production-secret-key-please-change-me
      - LOG_LEVEL=INFO
    restart: always
